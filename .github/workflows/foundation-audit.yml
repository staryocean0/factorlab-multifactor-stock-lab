name: REAKA foundation audit

on:
  pull_request:
    paths:
      - '.github/workflows/foundation-audit.yml'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/**'

permissions:
  contents: read

jobs:
  source-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare internal paper for mathematical review
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          mkdir -p audit-evidence
          pdftotext -layout research_materials/liao_residual_enhanced_adaptive_koopman_stock_prediction_2026.pdf audit-evidence/paper.txt
          sha256sum research_materials/liao_residual_enhanced_adaptive_koopman_stock_prediction_2026.pdf > audit-evidence/paper-sha256.txt
          git rev-parse HEAD > audit-evidence/source-commit.txt
          cp research_materials/liao_residual_enhanced_adaptive_koopman_stock_prediction_2026.pdf audit-evidence/paper.pdf
          pdftoppm -f 2 -l 4 -scale-to 1800 -png audit-evidence/paper.pdf audit-evidence/page
      - uses: actions/upload-artifact@v4
        with:
          name: private-foundation-source-${{ github.sha }}
          path: audit-evidence/
          retention-days: 7

  math-and-evidence-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - run: python -m pip install 'torch>=2.7,<3' --index-url https://download.pytorch.org/whl/cpu
      - name: Run synthetic mathematics and evidence counterexamples
        run: |
          mkdir -p audit-validation
          pytest -q tests/unit --junitxml=audit-validation/tests.xml
      - name: Collect current evidence audit without changing its verdict
        if: always()
        run: |
          mkdir -p audit-validation
          python scripts/audit_reaka_foundation.py --report-only > audit-validation/audit.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path("audit-validation/audit.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("## Foundation evidence status\n\n")
              out.write("Tests verify code behavior; they do not certify strategy readiness.\n\n")
              out.write("```json\n" + json.dumps(report, ensure_ascii=False, indent=2) + "\n```\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-validation-${{ github.sha }}
          path: audit-validation/
          retention-days: 30

