name: REAKA historical evidence audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  historical-evidence:
    name: Historical current@1.2 evidence report (no acceptance authority)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Preserve historical failures and source gaps
        run: |
          mkdir -p historical-audit
          python scripts/audit_reaka_foundation.py --report-only > historical-audit/audit.json
          python - <<'PYREPORT'
          import json, os
          from pathlib import Path
          report = json.loads(Path("historical-audit/audit.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("## Historical evidence only\n\n")
              out.write("Report generation success is not evidence acceptance. Current@1.3 infrastructure and data checks are separate jobs.\n\n")
              out.write("```json\n" + json.dumps(report, ensure_ascii=False, indent=2) + "\n```\n")
          PYREPORT
      - uses: actions/upload-artifact@v4
        with:
          name: historical-foundation-evidence-${{ github.sha }}
          path: historical-audit/
          retention-days: 30
