name: bounded-theme-validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    name: Five-in-one infrastructure (independent of market data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - run: python -m pip install 'torch>=2.7,<3' --index-url https://download.pytorch.org/whl/cpu
      - name: Strict current contract and reviewed source check
        run: |
          mkdir -p foundation-validation
          python scripts/validate_reaka_foundation.py > foundation-validation/contract.json
      - name: Synthetic mathematics, evidence and execution counterexamples
        run: pytest -q tests/unit --junitxml=foundation-validation/tests.xml
      - name: Require all collected tests to execute
        run: |
          python - <<'PYTEST'
          import xml.etree.ElementTree as ET
          suites = ET.parse("foundation-validation/tests.xml").getroot()
          assert sum(int(s.get("tests", 0)) for s in suites.iter("testsuite")) > 0
          assert sum(int(s.get("skipped", 0)) for s in suites.iter("testsuite")) == 0
          PYTEST
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-foundation-${{ github.sha }}
          path: foundation-validation/
          retention-days: 30

  dataset-integrity:
    name: Dataset integrity (separate upload readiness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - name: Strict manifest, file hashes and data boundaries
        run: python scripts/validate_theme_package.py
      - run: pytest -q tests/test_theme_boundaries.py
