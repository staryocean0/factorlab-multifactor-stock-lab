name: Public standard-runner research executor

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Reviewed execution profile
        type: choice
        options:
          - runtime-smoke
          - baseline-replay-v1
          - liq01-attribution-v1
          - liq01-support-v1
        default: runtime-smoke
        required: true

permissions:
  contents: read

concurrency:
  group: public-standard-research-executor
  cancel-in-progress: false

jobs:
  execute:
    if: >-
      github.repository == 'staryocean0/factorlab-multifactor-stock-lab' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/cloud-workspace-v1' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: private-research
    timeout-minutes: 45
    steps:
      - name: Checkout reviewed public executor only
        timeout-minutes: 3
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            executor
            tests
            .github/workflows
          sparse-checkout-cone-mode: true
      - name: Synthetic executor tests
        timeout-minutes: 2
        run: |
          python3 -m unittest discover -s tests -p 'test_executor.py' -v
          python3 -m unittest discover -s tests -p 'test_research_executor.py' -v
          python3 -m unittest discover -s tests -p 'test_support_profile_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_support_broker.py' -v
      - name: Build public runtime before private credentials or data
        timeout-minutes: 8
        run: docker build --tag factorlab-runtime:local executor
      - name: Prove isolated runtime (no private data)
        timeout-minutes: 2
        run: python3 executor/broker.py runtime-smoke
      - name: Prepare fixed inputs and prove private write authority
        id: prepare
        if: inputs.profile != 'runtime-smoke'
        timeout-minutes: 6
        env:
          JOB_PROFILE: ${{ inputs.profile }}
          FACTORLAB_PRIVATE_TOKEN: ${{ secrets.FACTORLAB_PRIVATE_TOKEN }}
        run: |
          case "$JOB_PROFILE" in
            baseline-replay-v1)
              python3 executor/broker.py prepare "$JOB_PROFILE"
              ;;
            liq01-attribution-v1)
              python3 executor/research_broker.py prepare "$JOB_PROFILE"
              ;;
            liq01-support-v1)
              python3 executor/support_broker.py prepare "$JOB_PROFILE"
              ;;
            *)
              echo "Execution stopped: unknown_profile" >&2
              exit 1
              ;;
          esac
      - name: Compute without private credential in step or container
        if: inputs.profile != 'runtime-smoke'
        timeout-minutes: 18
        env:
          JOB_PROFILE: ${{ inputs.profile }}
        run: |
          case "$JOB_PROFILE" in
            baseline-replay-v1)
              python3 executor/broker.py compute
              ;;
            liq01-attribution-v1)
              python3 executor/research_broker.py compute
              ;;
            liq01-support-v1)
              python3 executor/support_broker.py compute
              ;;
            *)
              echo "Execution stopped: unknown_profile" >&2
              exit 1
              ;;
          esac
      - name: Stop owned container before credentials return
        id: cleanup
        if: always() && steps.prepare.outcome == 'success'
        timeout-minutes: 1
        env:
          JOB_PROFILE: ${{ inputs.profile }}
        run: |
          case "$JOB_PROFILE" in
            baseline-replay-v1)
              python3 executor/broker.py cleanup
              ;;
            liq01-attribution-v1)
              python3 executor/research_broker.py cleanup
              ;;
            liq01-support-v1)
              python3 executor/support_broker.py cleanup
              ;;
            *)
              echo "Execution stopped: unknown_profile" >&2
              exit 1
              ;;
          esac
      - name: Return verified results or failure evidence privately
        if: always() && steps.prepare.outcome == 'success' && steps.cleanup.outcome == 'success'
        timeout-minutes: 6
        env:
          JOB_PROFILE: ${{ inputs.profile }}
          FACTORLAB_PRIVATE_TOKEN: ${{ secrets.FACTORLAB_PRIVATE_TOKEN }}
        run: |
          case "$JOB_PROFILE" in
            baseline-replay-v1)
              python3 executor/broker.py publish
              ;;
            liq01-attribution-v1)
              python3 executor/research_broker.py publish "$JOB_PROFILE"
              ;;
            liq01-support-v1)
              python3 executor/support_broker.py publish "$JOB_PROFILE"
              ;;
            *)
              echo "Execution stopped: unknown_profile" >&2
              exit 1
              ;;
          esac
